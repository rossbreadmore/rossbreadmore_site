<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ambient Intelligence Surface — Sentinel Surveillance Platform</title>
<meta name="description" content="Interactive prototype: Ambient Intelligence Surface for compliance surveillance. Calm-technology dashboard with agentic worker visibility and chat-first interaction.">
<meta property="og:title" content="Sentinel — Ambient Intelligence Surface">
<meta property="og:description" content="Future surveillance platform concept: calm complexity, agentic transparency, and conversational intelligence.">
<meta property="og:type" content="website">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@300;400;500&display=swap');

  :root {
    --bg: #06080f;
    --surface: #0c1018;
    --surface-2: #111827;
    --surface-3: #1a2235;
    --border: #1a2030;
    --border-subtle: #141c2a;
    --text: #e2e8f0;
    --text-dim: #64748b;
    --text-muted: #3a4558;
    --accent: #3b82f6;
    --accent-soft: rgba(59, 130, 246, 0.08);
    --accent-glow: rgba(59, 130, 246, 0.2);
    --green: #10b981;
    --green-soft: rgba(16, 185, 129, 0.06);
    --green-glow: rgba(16, 185, 129, 0.15);
    --amber: #f59e0b;
    --amber-soft: rgba(245, 158, 11, 0.06);
    --amber-glow: rgba(245, 158, 11, 0.15);
    --red: #ef4444;
    --red-soft: rgba(239, 68, 68, 0.06);
    --red-glow: rgba(239, 68, 68, 0.15);
    --purple: #8b5cf6;
    --cyan: #06b6d4;
    --radius: 12px;
    --radius-sm: 8px;
    --font: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    --mono: 'JetBrains Mono', 'SF Mono', 'Fira Code', monospace;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: var(--font);
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  /* TOP BAR */
  .topbar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 28px; height: 52px;
    border-bottom: 1px solid var(--border-subtle);
    flex-shrink: 0; background: rgba(6,8,15,0.85);
    backdrop-filter: blur(20px); z-index: 100;
  }
  .topbar-left { display: flex; align-items: center; gap: 18px; }
  .topbar-logo {
    font-size: 13px; font-weight: 600; letter-spacing: 2px; text-transform: uppercase;
    background: linear-gradient(135deg, var(--accent), var(--cyan));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  }
  .topbar-status { display: flex; align-items: center; gap: 8px; font-size: 11px; color: var(--text-muted); }
  .status-dot {
    width: 6px; height: 6px; border-radius: 50%; background: var(--green);
    box-shadow: 0 0 8px var(--green-glow); animation: breathe 3s ease-in-out infinite;
  }
  @keyframes breathe { 0%,100%{opacity:.5;transform:scale(1)} 50%{opacity:1;transform:scale(1.2)} }
  .topbar-center { display: flex; align-items: center; gap: 10px; }
  .scenario-toggle { display: flex; border-radius: var(--radius-sm); border: 1px solid var(--border); overflow: hidden; }
  .scenario-tab {
    font-size: 11px; padding: 5px 14px; background: transparent; color: var(--text-muted);
    border: none; cursor: pointer; transition: all 0.2s; font-family: var(--font); white-space: nowrap;
  }
  .scenario-tab:not(:last-child) { border-right: 1px solid var(--border); }
  .scenario-tab.active { background: var(--accent); color: white; }
  .scenario-tab:hover:not(.active) { color: var(--text-dim); background: var(--surface-2); }
  .topbar-right { display: flex; align-items: center; gap: 14px; }
  .topbar-metric { text-align: right; }
  .topbar-metric .value { font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums; color: var(--text); }
  .topbar-metric .label { font-size: 9px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; }
  .topbar-divider { width: 1px; height: 26px; background: var(--border); }

  /* MAIN */
  .main { display: flex; flex: 1; overflow: hidden; position: relative; }

  /* AGENT STREAM */
  .agent-stream {
    width: 310px; border-right: 1px solid var(--border-subtle);
    display: flex; flex-direction: column; background: rgba(6,8,15,0.6);
    flex-shrink: 0; position: relative; overflow: hidden;
  }
  .agent-stream::after {
    content:''; position: absolute; bottom: 0; left: 0; right: 0; height: 60px;
    background: linear-gradient(transparent, var(--bg)); pointer-events: none; z-index: 2;
  }
  .agent-stream-header {
    padding: 14px 18px; border-bottom: 1px solid var(--border-subtle);
    display: flex; align-items: center; justify-content: space-between; flex-shrink: 0;
  }
  .agent-stream-header h2 {
    font-size: 10px; font-weight: 500; color: var(--text-muted);
    text-transform: uppercase; letter-spacing: 1.2px;
    display: flex; align-items: center; gap: 8px;
  }
  .agent-count-badge {
    font-size: 10px; padding: 2px 8px; border-radius: 10px;
    background: var(--accent-soft); color: var(--accent); font-weight: 600; font-family: var(--mono);
  }
  .agent-stream-list { flex: 1; overflow: hidden; padding: 6px 10px; position: relative; }
  .agent-item {
    padding: 9px 11px; border-radius: var(--radius-sm); margin-bottom: 3px;
    font-size: 11px; line-height: 1.5; color: var(--text-dim);
    border: 1px solid transparent; transition: all 0.4s; animation: fadeInUp 0.5s ease-out;
  }
  @keyframes fadeInUp { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }
  .agent-item.finding { background: var(--amber-soft); border-color: rgba(245,158,11,0.15); color: var(--text); }
  .agent-item.critical { background: var(--red-soft); border-color: rgba(239,68,68,0.2); color: var(--text); }
  .agent-item .agent-name {
    font-family: var(--mono); font-size: 10px; font-weight: 500; color: var(--cyan);
    margin-bottom: 2px; display: flex; align-items: center; gap: 6px;
  }
  .agent-item .agent-name .spinner {
    width: 8px; height: 8px; border: 1.5px solid var(--cyan); border-top-color: transparent;
    border-radius: 50%; animation: spin 1s linear infinite; flex-shrink: 0;
  }
  @keyframes spin { to{transform:rotate(360deg)} }
  .agent-item .agent-name .check { color: var(--green); font-size: 10px; }
  .agent-item .agent-name .alert-icon { color: var(--amber); font-size: 10px; }
  .agent-item .agent-body { font-family: var(--mono); font-size: 10.5px; line-height: 1.5; }
  .agent-item .agent-time { font-size: 9px; color: var(--text-muted); margin-top: 3px; font-family: var(--mono); }

  .agent-stats {
    padding: 10px 18px; border-top: 1px solid var(--border-subtle);
    display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px;
    flex-shrink: 0; z-index: 3; background: var(--bg);
  }
  .agent-stat { text-align: center; }
  .agent-stat .num { font-size: 17px; font-weight: 600; font-variant-numeric: tabular-nums; font-family: var(--mono); }
  .agent-stat .num.green { color: var(--green); }
  .agent-stat .num.amber { color: var(--amber); }
  .agent-stat .num.blue { color: var(--accent); }
  .agent-stat .desc { font-size: 9px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; margin-top: 2px; }

  /* SURFACE */
  .surface { flex: 1; position: relative; overflow: hidden; background: var(--bg); }
  #ambientCanvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; opacity: 0.35; }
  .desk-grid {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; z-index: 2; padding: 32px;
  }
  .desk-node {
    width: 134px; height: 112px; border-radius: var(--radius); border: 1px solid var(--border);
    background: var(--surface); display: flex; flex-direction: column;
    align-items: center; justify-content: center; cursor: pointer;
    transition: all 0.6s cubic-bezier(0.16,1,0.3,1); position: relative; overflow: hidden;
  }
  .desk-node::before {
    content:''; position: absolute; top: 0; left: 0; right: 0; height: 3px;
    background: var(--green); opacity: 0.5; transition: all 0.6s;
  }
  .desk-node:hover { border-color: var(--accent); transform: translateY(-2px); box-shadow: 0 8px 28px rgba(0,0,0,0.3); }
  .desk-node.elevated { border-color: var(--amber); box-shadow: 0 0 20px var(--amber-soft); animation: nodeAmber 3s ease-in-out infinite; }
  .desk-node.elevated::before { background: var(--amber); opacity: 1; }
  .desk-node.critical { border-color: var(--red); box-shadow: 0 0 28px var(--red-soft); animation: nodeRed 2s ease-in-out infinite; }
  .desk-node.critical::before { background: var(--red); opacity: 1; }
  @keyframes nodeAmber { 0%,100%{box-shadow:0 0 20px var(--amber-soft)} 50%{box-shadow:0 0 36px rgba(245,158,11,0.12)} }
  @keyframes nodeRed { 0%,100%{box-shadow:0 0 24px var(--red-soft)} 50%{box-shadow:0 0 44px rgba(239,68,68,0.15)} }
  .desk-node .desk-name { font-size: 12px; font-weight: 600; color: var(--text); margin-bottom: 3px; }
  .desk-node .desk-sub { font-size: 9px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; }
  .desk-node .desk-indicator { margin-top: 8px; display: flex; gap: 3px; align-items: center; }
  .desk-node .desk-indicator .bar {
    width: 3.5px; border-radius: 2px; background: var(--green); opacity: 0.4; transition: all 0.6s;
  }
  .desk-node.elevated .desk-indicator .bar { background: var(--amber); opacity: 0.7; }
  .desk-node.critical .desk-indicator .bar { background: var(--red); opacity: 0.9; }
  .desk-node .desk-badge {
    position: absolute; top: 7px; right: 7px; width: 18px; height: 18px; border-radius: 50%;
    background: var(--red); color: white; font-size: 9px; font-weight: 700;
    display: flex; align-items: center; justify-content: center;
    opacity: 0; transform: scale(0); transition: all 0.4s cubic-bezier(0.34,1.56,0.64,1);
  }
  .desk-node.elevated .desk-badge, .desk-node.critical .desk-badge { opacity: 1; transform: scale(1); }

  /* ATTENTION CARDS */
  .attention-cards {
    position: absolute; bottom: 20px; left: 20px; right: 412px;
    display: flex; gap: 12px; z-index: 10; pointer-events: none;
  }
  .attention-card {
    background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 14px 18px; min-width: 260px; max-width: 320px;
    pointer-events: auto; cursor: pointer; backdrop-filter: blur(20px);
    transition: all 0.4s cubic-bezier(0.16,1,0.3,1); animation: cardEmerge 0.6s cubic-bezier(0.16,1,0.3,1);
    position: relative; overflow: hidden;
  }
  @keyframes cardEmerge { from{opacity:0;transform:translateY(20px)} to{opacity:1;transform:translateY(0)} }
  .attention-card:hover { transform: translateY(-4px); box-shadow: 0 12px 36px rgba(0,0,0,0.4); }
  .attention-card::before { content:''; position: absolute; top: 0; left: 0; right: 0; height: 2px; }
  .attention-card.amber::before { background: var(--amber); }
  .attention-card.red::before { background: var(--red); }
  .attention-card .card-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
  .attention-card .card-severity {
    font-size: 9px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.8px;
    padding: 2px 8px; border-radius: 6px;
  }
  .attention-card.amber .card-severity { background: var(--amber-soft); color: var(--amber); }
  .attention-card.red .card-severity { background: var(--red-soft); color: var(--red); }
  .attention-card .card-time { font-size: 9px; color: var(--text-muted); font-family: var(--mono); }
  .attention-card .card-title { font-size: 13px; font-weight: 600; margin-bottom: 5px; color: var(--text); }
  .attention-card .card-body { font-size: 11px; color: var(--text-dim); line-height: 1.5; }
  .attention-card .card-agents { margin-top: 8px; display: flex; gap: 5px; flex-wrap: wrap; }
  .attention-card .agent-tag {
    font-size: 9px; font-family: var(--mono); padding: 2px 7px; border-radius: 6px;
    background: var(--accent-soft); color: var(--accent);
  }

  /* CHAT PANEL */
  .chat-panel {
    width: 392px; border-left: 1px solid var(--border-subtle);
    display: flex; flex-direction: column; background: rgba(6,8,15,0.85);
    backdrop-filter: blur(20px); flex-shrink: 0; z-index: 20;
  }
  .chat-header {
    padding: 14px 18px; border-bottom: 1px solid var(--border-subtle);
    display: flex; align-items: center; gap: 10px;
  }
  .chat-header .ai-avatar {
    width: 30px; height: 30px; border-radius: 50%;
    background: linear-gradient(135deg, var(--accent), var(--cyan));
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; font-weight: 700; color: white; flex-shrink: 0;
  }
  .chat-header-text h2 { font-size: 13px; font-weight: 600; color: var(--text); }
  .chat-header-text .sub { font-size: 10px; color: var(--text-muted); }

  .chat-messages {
    flex: 1; overflow-y: auto; padding: 16px 18px; display: flex; flex-direction: column; gap: 14px;
  }
  .chat-messages::-webkit-scrollbar { width: 4px; }
  .chat-messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
  .chat-msg { max-width: 95%; animation: msgAppear 0.3s ease-out; }
  @keyframes msgAppear { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }
  .chat-msg.user { align-self: flex-end; }
  .chat-msg.user .msg-bubble {
    background: var(--accent); color: white; border-radius: var(--radius) var(--radius) 4px var(--radius);
    padding: 10px 14px; font-size: 12px; line-height: 1.5;
  }
  .chat-msg.ai .msg-bubble {
    background: var(--surface-2); border: 1px solid var(--border);
    border-radius: var(--radius) var(--radius) var(--radius) 4px;
    padding: 12px 16px; font-size: 12px; line-height: 1.6; color: var(--text);
  }
  .chat-msg .msg-time { font-size: 9px; color: var(--text-muted); margin-top: 3px; font-family: var(--mono); }
  .chat-msg.user .msg-time { text-align: right; }

  .chat-card {
    background: var(--surface-3); border: 1px solid var(--border); border-radius: var(--radius-sm);
    padding: 12px; margin-top: 8px;
  }
  .chat-card .card-row { display: flex; justify-content: space-between; padding: 3px 0; font-size: 11px; }
  .chat-card .card-row .k { color: var(--text-dim); }
  .chat-card .card-row .v { color: var(--text); font-weight: 500; font-variant-numeric: tabular-nums; }
  .chat-card .card-row .v.red { color: var(--red); }
  .chat-card .card-row .v.amber { color: var(--amber); }
  .chat-card .card-row .v.green { color: var(--green); }
  .chat-card-title { font-size: 11px; font-weight: 600; color: var(--text); margin-bottom: 6px; display: flex; align-items: center; gap: 6px; }
  .chat-card-bar { height: 4px; border-radius: 2px; background: var(--surface); margin-top: 8px; overflow: hidden; }
  .chat-card-bar-fill { height: 100%; border-radius: 2px; transition: width 1s ease-out; }

  .typing-indicator { display: flex; gap: 4px; padding: 10px 14px; align-items: center; }
  .typing-indicator .dot {
    width: 5px; height: 5px; border-radius: 50%; background: var(--text-muted);
    animation: typingBounce 1.4s ease-in-out infinite;
  }
  .typing-indicator .dot:nth-child(2) { animation-delay: 0.2s; }
  .typing-indicator .dot:nth-child(3) { animation-delay: 0.4s; }
  @keyframes typingBounce { 0%,60%,100%{transform:translateY(0);opacity:.3} 30%{transform:translateY(-5px);opacity:1} }

  .suggestions { padding: 6px 18px; display: flex; flex-wrap: wrap; gap: 5px; }
  .suggestion-chip {
    font-size: 10px; padding: 5px 11px; border-radius: 20px; border: 1px solid var(--border);
    background: transparent; color: var(--text-dim); cursor: pointer; transition: all 0.15s;
    font-family: var(--font);
  }
  .suggestion-chip:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }

  .chat-input-area { padding: 14px 18px; border-top: 1px solid var(--border-subtle); }
  .chat-input-wrapper {
    display: flex; align-items: center; gap: 8px;
    background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 4px 4px 4px 14px; transition: border-color 0.15s;
  }
  .chat-input-wrapper:focus-within { border-color: var(--accent); }
  .chat-input {
    flex: 1; background: none; border: none; color: var(--text); font-size: 12px;
    font-family: var(--font); outline: none; padding: 7px 0;
  }
  .chat-input::placeholder { color: var(--text-muted); }
  .chat-send {
    width: 34px; height: 34px; border-radius: var(--radius-sm); background: var(--accent);
    border: none; color: white; cursor: pointer; display: flex; align-items: center;
    justify-content: center; transition: all 0.15s; flex-shrink: 0;
  }
  .chat-send:hover { background: #2563eb; }
  .chat-send svg { width: 15px; height: 15px; }

  .concept-label {
    position: fixed; bottom: 14px; left: 50%; transform: translateX(-50%);
    font-size: 10px; color: var(--text-muted); background: var(--surface);
    padding: 5px 14px; border-radius: 20px; border: 1px solid var(--border); z-index: 50; pointer-events: none;
  }

  .toast {
    position: fixed; top: 62px; left: 50%; transform: translateX(-50%) translateY(-20px);
    background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 10px 18px; font-size: 12px; color: var(--text); z-index: 200;
    opacity: 0; transition: all 0.4s cubic-bezier(0.16,1,0.3,1); backdrop-filter: blur(20px);
    display: flex; align-items: center; gap: 10px;
  }
  .toast.visible { opacity: 1; transform: translateX(-50%) translateY(0); }
  .toast .toast-icon {
    width: 18px; height: 18px; border-radius: 50%; display: flex; align-items: center;
    justify-content: center; font-size: 10px; flex-shrink: 0;
  }
  .toast .toast-icon.red { background: var(--red-soft); color: var(--red); }
  .toast .toast-icon.amber { background: var(--amber-soft); color: var(--amber); }
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-left">
    <span class="topbar-logo">Sentinel</span>
    <div class="topbar-status"><span class="status-dot"></span><span id="agentStatusText">42 agents active</span></div>
  </div>
  <div class="topbar-center">
    <div class="scenario-toggle">
      <button class="scenario-tab active" data-scenario="insider">Insider Trading</button>
      <button class="scenario-tab" data-scenario="barrier">Barrier Breach</button>
    </div>
  </div>
  <div class="topbar-right">
    <div class="topbar-metric"><div class="value" id="metricAlerts">3</div><div class="label">Open alerts</div></div>
    <div class="topbar-divider"></div>
    <div class="topbar-metric"><div class="value" id="metricScanned">847k</div><div class="label">Events today</div></div>
    <div class="topbar-divider"></div>
    <div class="topbar-metric"><div class="value" id="metricCoverage">99.2%</div><div class="label">Coverage</div></div>
  </div>
</div>

<div class="main">
  <div class="agent-stream">
    <div class="agent-stream-header">
      <h2>Agent Activity <span class="agent-count-badge" id="activeAgentCount">42</span></h2>
    </div>
    <div class="agent-stream-list" id="agentStreamList"></div>
    <div class="agent-stats">
      <div class="agent-stat"><div class="num green" id="statCleared">1,247</div><div class="desc">Cleared</div></div>
      <div class="agent-stat"><div class="num amber" id="statFlagged">18</div><div class="desc">Flagged</div></div>
      <div class="agent-stat"><div class="num blue" id="statRunning">42</div><div class="desc">Running</div></div>
    </div>
  </div>

  <div class="surface" id="surface">
    <canvas id="ambientCanvas"></canvas>
    <div class="desk-grid" id="deskGrid"></div>
    <div class="attention-cards" id="attentionCards"></div>
  </div>

  <div class="chat-panel">
    <div class="chat-header">
      <div class="ai-avatar">S</div>
      <div class="chat-header-text"><h2>Sentinel</h2><div class="sub">Compliance Intelligence</div></div>
    </div>
    <div class="chat-messages" id="chatMessages"></div>
    <div class="suggestions" id="suggestions"></div>
    <div class="chat-input-area">
      <div class="chat-input-wrapper">
        <input type="text" class="chat-input" id="chatInput" placeholder="Ask about any desk, person, or pattern..." />
        <button class="chat-send" onclick="handleSend()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 2L11 13"/><path d="M22 2L15 22L11 13L2 9L22 2Z"/></svg>
        </button>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"><div class="toast-icon amber" id="toastIcon">!</div><span id="toastText"></span></div>
<div class="concept-label">Concept 2 — Ambient Intelligence Surface</div>

<script>
// ============================================
// SCENARIO DATA
// ============================================

const scenarioData = {
  insider: {
    metrics: { alerts: '3', scanned: '847k', coverage: '99.2%' },
    stats: { cleared: '1,247', flagged: '18', running: '42' },
    agentCount: '42',
    desks: [
      { id:'eq', name:'Equities', sub:'US Markets', status:'critical', alerts:2, bars:[3,5,8,6,9,7,4] },
      { id:'fi', name:'Fixed Income', sub:'Rates & Credit', status:'normal', alerts:0, bars:[2,3,2,3,2,2,3] },

function renderAll() {
  const s = SD();
  // Metrics
  document.getElementById('metricAlerts').textContent = s.metrics.alerts;
  document.getElementById('metricScanned').textContent = s.metrics.scanned;
  document.getElementById('metricCoverage').textContent = s.metrics.coverage;
  document.getElementById('activeAgentCount').textContent = s.agentCount;
  document.getElementById('agentStatusText').textContent = s.agentCount + ' agents active';
  document.getElementById('statCleared').textContent = s.stats.cleared;
  document.getElementById('statFlagged').textContent = s.stats.flagged;
  document.getElementById('statRunning').textContent = s.stats.running;

  renderDesks();
  renderAgentStream();
  renderAttentionCards();
  renderInitialChat();

function renderDesks() {
  const grid = document.getElementById('deskGrid');
  grid.innerHTML = '';
  SD().desks.forEach(d => {
    const node = document.createElement('div');
    node.className = `desk-node ${d.status}`;
    node.dataset.id = d.id;
    node.innerHTML = `
      <div class="desk-badge">${d.alerts}</div>
      <div class="desk-name">${d.name}</div>
      <div class="desk-sub">${d.sub}</div>
      <div class="desk-indicator">${d.bars.map(h=>`<div class="bar" style="height:${h*2+4}px"></div>`).join('')}</div>
    `;
    node.addEventListener('click', () => {
      const query = Object.keys(SD().chatResponses)[0];
      if (d.status !== 'normal') processMessage(query);
    });
    grid.appendChild(node);
  });
}

function renderAgentStream() {
  const list = document.getElementById('agentStreamList');
  list.innerHTML = '';
  SD().agentFeed.forEach((a, i) => {
    const item = document.createElement('div');
    item.className = `agent-item ${a.type==='finding'?'finding':a.type==='critical'?'critical':''}`;
    item.style.animationDelay = (i*0.04)+'s';
    const icon = a.type==='running' ? '<span class="spinner"></span>' : a.type==='complete' ? '<span class="check">✓</span>' : '<span class="alert-icon">⚡</span>';
    const now = new Date();
    const t = new Date(now.getTime() - (i*45000));
    const ts = `${String(t.getHours()).padStart(2,'0')}:${String(t.getMinutes()).padStart(2,'0')}:${String(t.getSeconds()).padStart(2,'0')}`;
    item.innerHTML = `<div class="agent-name">${icon} ${a.agent}</div><div class="agent-body">${a.body}</div><div class="agent-time">${ts}</div>`;
    list.appendChild(item);
  });
}

function renderAttentionCards() {
  const container = document.getElementById('attentionCards');
  container.innerHTML = '';
  SD().attentionCards.forEach(c => {
    const card = document.createElement('div');
    card.className = `attention-card ${c.cls}`;
    card.onclick = () => processMessage(c.query);
    card.innerHTML = `
      <div class="card-header"><span class="card-severity">${c.severity}</span><span class="card-time">${c.time}</span></div>

function renderInitialChat() {
  const container = document.getElementById('chatMessages');
  container.innerHTML = '';

  if (ic.card) {
    html += `<div class="chat-card"><div class="chat-card-title">${ic.card.title}</div>`;

function addUserMsg(text) {
  const container = document.getElementById('chatMessages');
  const div = document.createElement('div');
  div.className = 'chat-msg user';
  const now = new Date();
  div.innerHTML = `<div class="msg-bubble">${text}</div><div class="msg-time">${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}</div>`;
  container.appendChild(div);
  container.scrollTop = container.scrollHeight;
}

function addAIMsg(html, timeOverride) {
  const container = document.getElementById('chatMessages');
  const div = document.createElement('div');
  div.className = 'chat-msg ai';
  const now = new Date();
  const t = timeOverride || `${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
  div.innerHTML = `<div class="msg-bubble">${html}</div><div class="msg-time">${t}</div>`;
  container.appendChild(div);
  container.scrollTop = container.scrollHeight;
}

function addTyping() {
  const container = document.getElementById('chatMessages');
  const div = document.createElement('div');
  div.className = 'chat-msg ai'; div.id = 'typingInd';
  div.innerHTML = '<div class="msg-bubble"><div class="typing-indicator"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div></div>';
  container.appendChild(div);
  container.scrollTop = container.scrollHeight;
}
function removeTyping() { const el = document.getElementById('typingInd'); if(el) el.remove(); }

function updateSuggestions(items) {
  const container = document.getElementById('suggestions');
  container.innerHTML = '';
  items.forEach(s => {
    const chip = document.createElement('button');
    chip.className = 'suggestion-chip'; chip.textContent = s;
    chip.onclick = () => processMessage(s);
    container.appendChild(chip);
  });
}

function buildResponseHTML(resp) {
  let html = `<p>${resp.text}</p>`;
  if (resp.card) {
    html += `<div class="chat-card"><div class="chat-card-title">${resp.card.title}</div>`;
    resp.card.rows.forEach(r => { html += `<div class="card-row"><span class="k">${r.k}</span><span class="v ${r.c}">${r.v}</span></div>`; });
    if (resp.card.bar) html += `<div class="chat-card-bar"><div class="chat-card-bar-fill" style="width:0%;background:${resp.card.bar.color}" data-target="${resp.card.bar.w}"></div></div>`;
    html += `</div>`;
  }
  if (resp.followUp) html += `<p style="margin-top:10px">${resp.followUp}</p>`;
  return html;
}

const defaultResp = {
  text:'Searching across all agent feeds and data sources:',
  card:{title:'Search Results', rows:[{k:'Agents queried',v:'All active',c:''},{k:'Status',v:'Processing...',c:'amber'}], bar:{w:'45%',color:'var(--accent)'}},
  followUp:"I'll update this view as findings come in. Try refining your query or explore the surface.",
  suggestions:['Narrow to this week','Focus on flagged desks','Show all open alerts'],
};

function processMessage(text) {
  addUserMsg(text);
  addTyping();
  const resp = SD().chatResponses[text] || defaultResp;
  setTimeout(() => {
    removeTyping();
    addAIMsg(buildResponseHTML(resp));
    // Animate bars
    setTimeout(() => {
      document.querySelectorAll('.chat-card-bar-fill[data-target]').forEach(bar => {
        if (bar.style.width === '0%') bar.style.width = bar.dataset.target;
      });
    }, 100);
    updateSuggestions(resp.suggestions || defaultResp.suggestions);
    if (resp.highlight) highlightDesk(resp.highlight);
  }, 1000 + Math.random() * 800);
}

function highlightDesk(id) {
  const node = document.querySelector(`.desk-node[data-id="${id}"]`);
  if (!node) return;
  node.style.transform = 'translateY(-4px) scale(1.05)';
  node.style.boxShadow = '0 0 36px var(--accent-glow), 0 10px 36px rgba(0,0,0,0.4)';
  node.style.borderColor = 'var(--accent)';
  setTimeout(() => { node.style.transform=''; node.style.boxShadow=''; node.style.borderColor=''; }, 3000);
}

function handleSend() {
  const input = document.getElementById('chatInput');
  const text = input.value.trim();
  if (!text) return;
  input.value = '';
  processMessage(text);
}

function initCanvas() {
  const canvas = document.getElementById('ambientCanvas');
  const ctx = canvas.getContext('2d');
  let particles = [];
  function resize() {
    canvas.width = canvas.offsetWidth * (window.devicePixelRatio||1);
    canvas.height = canvas.offsetHeight * (window.devicePixelRatio||1);
    ctx.scale(window.devicePixelRatio||1, window.devicePixelRatio||1);
  }
  resize(); window.addEventListener('resize', resize);
  for (let i=0; i<50; i++) particles.push({
    x:Math.random()*canvas.offsetWidth, y:Math.random()*canvas.offsetHeight,
    vx:(Math.random()-0.5)*0.25, vy:(Math.random()-0.5)*0.25,
    r:Math.random()*1.5+0.5, o:Math.random()*0.25+0.08,
  });
  function draw() {
    ctx.clearRect(0,0,canvas.offsetWidth,canvas.offsetHeight);
    for(let i=0;i<particles.length;i++) {
      for(let j=i+1;j<particles.length;j++) {
        const dx=particles[i].x-particles[j].x, dy=particles[i].y-particles[j].y;
        const dist=Math.sqrt(dx*dx+dy*dy);
        if(dist<110) { ctx.beginPath(); ctx.moveTo(particles[i].x,particles[i].y); ctx.lineTo(particles[j].x,particles[j].y);
          ctx.strokeStyle=`rgba(59,130,246,${0.05*(1-dist/110)})`; ctx.lineWidth=0.5; ctx.stroke(); }
      }
    }
    particles.forEach(p => {
      ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
      ctx.fillStyle=`rgba(59,130,246,${p.o})`; ctx.fill();
      p.x+=p.vx; p.y+=p.vy;
      if(p.x<0)p.x=canvas.offsetWidth; if(p.x>canvas.offsetWidth)p.x=0;
      if(p.y<0)p.y=canvas.offsetHeight; if(p.y>canvas.offsetHeight)p.y=0;
    });
    requestAnimationFrame(draw);
  }
  draw();
}

// ============================================
// LIVE FEED + ESCALATION
// ============================================

function startLiveFeed() {
  if (liveInterval) clearInterval(liveInterval);
  liveIndex = 0;
  liveInterval = setInterval(() => {
    const feed = SD().liveFeed;
    const a = feed[liveIndex % feed.length];
    liveIndex++;
    const list = document.getElementById('agentStreamList');
    const now = new Date();
    const ts = `${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}:${String(now.getSeconds()).padStart(2,'0')}`;
    const item = document.createElement('div');
    item.className = `agent-item ${a.type==='finding'?'finding':a.type==='critical'?'critical':''}`;
    const icon = a.type==='running'?'<span class="spinner"></span>':a.type==='complete'?'<span class="check">✓</span>':'<span class="alert-icon">⚡</span>';
    item.innerHTML = `<div class="agent-name">${icon} ${a.agent}</div><div class="agent-body">${a.body}</div><div class="agent-time">${ts}</div>`;
    list.insertBefore(item, list.firstChild);
    while(list.children.length > 18) list.removeChild(list.lastChild);
    // Update scanned metric
    const el = document.getElementById('metricScanned');
    const cur = parseFloat(el.textContent.replace('k',''));
    el.textContent = (cur + Math.random()*1.5).toFixed(0) + 'k';
  }, 3500 + Math.random()*2000);
}

function scheduleEscalation() {
  if (escalationTimeout) clearTimeout(escalationTimeout);
  escalationTimeout = setTimeout(() => {
    const esc = SD().escalation;
    // Toast
    const toast = document.getElementById('toast');
    document.getElementById('toastText').textContent = esc.toast;
    document.getElementById('toastIcon').className = 'toast-icon ' + esc.toastIcon;
    toast.classList.add('visible');
    setTimeout(() => toast.classList.remove('visible'), 5000);
    // Desk state
    const node = document.querySelector(`.desk-node[data-id="${esc.deskId}"]`);
    if (node) { node.classList.remove('elevated','normal'); node.classList.add(esc.deskTo); }
    // Agent message
    const list = document.getElementById('agentStreamList');
    const now = new Date();
    const ts = `${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}:${String(now.getSeconds()).padStart(2,'0')}`;
    const item = document.createElement('div');
    item.className = 'agent-item critical';
    const m = esc.agentMsg;
    item.innerHTML = `<div class="agent-name"><span class="alert-icon">⚡</span> ${m.agent}</div><div class="agent-body">${m.body}</div><div class="agent-time">${ts}</div>`;
    list.insertBefore(item, list.firstChild);
  }, 15000);
}

function startBarAnimation() {
  if (barInterval) clearInterval(barInterval);
  barInterval = setInterval(() => {
    document.querySelectorAll('.desk-node .bar').forEach(bar => {
      const h = parseInt(bar.style.height);
      bar.style.height = Math.max(4, Math.min(22, h + (Math.random()-0.5)*3)) + 'px';
    });
  }, 2000);
}

// ============================================
// SCENARIO SWITCH
// ============================================

document.querySelectorAll('.scenario-tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.scenario-tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    currentScenario = tab.dataset.scenario;
    renderAll();
    startLiveFeed();
    scheduleEscalation();
  });
});

// Keyboard
document.getElementById('chatInput').addEventListener('keydown', e => { if(e.key==='Enter') handleSend(); });
document.addEventListener('keydown', e => { if((e.metaKey||e.ctrlKey)&&e.key==='k'){e.preventDefault();document.getElementById('chatInput').focus();} });

// ============================================
// INIT
// ============================================
renderAll();
initCanvas();
startLiveFeed();
scheduleEscalation();
startBarAnimation();
</script>
